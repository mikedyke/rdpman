name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: rdpman
          path: rdpman.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "%GITHUB_REF_NAME%" rdpman.exe --title "rdpman %GITHUB_REF_NAME%" --generate-notes
